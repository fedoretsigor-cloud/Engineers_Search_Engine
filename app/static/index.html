<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Engineers Search</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Phase 5 Recruiter Chat</p>
          <h1>Engineers Search</h1>
        </div>
        <div class="status" id="app-status">Frontend script loading...</div>
      </header>

      <section class="workspace" aria-label="Search workspace">
        <section class="left-column">
          <section class="chat-panel" aria-label="Recruiter chat">
            <div class="panel-header">
              <h2>Recruiter Chat</h2>
              <p id="chat-status">Describe the search in Russian or English.</p>
            </div>

            <div class="chat-messages" id="chat-messages" aria-live="polite"></div>

            <form class="chat-form" id="recruiter-chat-form">
              <label>
                Message
                <textarea
                  id="chat-input"
                  name="chatInput"
                  rows="4"
                  autocomplete="off"
                  placeholder="Найди backend разработчиков в Украине, основной стек Java, желательно Spring и Kafka."
                ></textarea>
              </label>
              <div class="actions">
                <button class="secondary-button" id="reset-chat" type="button">Reset</button>
                <button class="primary-button" id="send-chat" type="submit">Send</button>
              </div>
            </form>

            <div class="brief-summary-panel" id="brief-summary-panel" hidden></div>

            <section
              class="agent-action-queue"
              id="agent-action-queue"
              aria-label="Agent action review queue"
            ></section>

            <div class="filter-toggles execution-controls" aria-label="Execution controls">
              <label class="toggle-field">
                <input id="profiles-only" name="profilesOnly" type="checkbox" checked />
                <span>LinkedIn profiles only</span>
              </label>

              <label class="toggle-field">
                <input id="location-filter-enabled" name="locationFilterEnabled" type="checkbox" checked />
                <span>Location filter</span>
              </label>

              <label class="toggle-field">
                <input id="multi-wave-enabled" name="multiWaveEnabled" type="checkbox" />
                <span>Multi-wave</span>
              </label>
            </div>

            <div class="actions">
              <button class="secondary-button" id="build-plan" type="button" disabled>Build Plan</button>
              <button class="primary-button" id="approve-search" type="button" disabled>Approve & Search</button>
            </div>
          </section>

          <section class="plan-panel" aria-live="polite">
            <details class="collapsible-panel query-plan-collapsible">
              <summary class="collapsible-summary">
                <div class="panel-header">
                  <h2>Generated QueryPlan</h2>
                  <p id="plan-status">Building plan...</p>
                </div>
                <span class="collapse-indicator" aria-hidden="true"></span>
              </summary>
              <div class="collapsible-content">
                <div class="query-list" id="query-list"></div>
              </div>
            </details>
          </section>
        </section>

        <section class="right-column">
          <section class="report-panel" aria-live="polite">
            <div class="panel-header">
              <h2>Report</h2>
              <p id="report-status">Run a search to see counts.</p>
            </div>
            <div class="report-grid" id="report-grid"></div>
            <div class="contribution-list" id="contribution-list"></div>
          </section>

          <section class="results-panel" aria-live="polite">
            <div class="panel-header">
              <h2>Results</h2>
              <p id="results-status">Run a search to see deduped candidates.</p>
            </div>
            <div class="results-list" id="results-list"></div>
          </section>
        </section>
      </section>
    </main>

    <script src="/static/candidate_workspace.js"></script>
    <script src="/static/app.js"></script>
  </body>
</html>
